<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar seu Estacionamento</title>
    <!-- Bootstrap CDN -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styleCadastroEstacionamento.css') }}">

    <!-- Arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-light fixed-navbar">
        <a class="navbar-brand mx-auto" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='imgs/easy01.png') }}" alt="Logo" class="navbar-logo">
        </a>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card">
                    <div class="card-body">
                        <form action="{{ url_for('cadEstacionamento') }}" method="POST">
                            <!-- Campo para o nome do estacionamento -->
                            <div class="form-row">
                                <div class="col-md-12 mb-3">
                                    <label for="nome">Nome do estacionamento</label>
                                    <input type="text" class="form-control" id="nome" placeholder="Nome do estacionamento" name="nome" required>
                                </div>
                            </div>
    
                            <!-- Estado e Cidade -->
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label for="estado">Estado</label>
                                    <input type="text" class="form-control" id="estado" placeholder="Estado" name="estado" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cidade">Cidade</label>
                                    <input type="text" class="form-control" id="cidade" placeholder="Cidade" name="cidade" required>
                                </div>
                            </div>
    
                            <!-- Bairro e Rua -->
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label for="bairro">Bairro</label>
                                    <input type="text" class="form-control" id="bairro" placeholder="Bairro" name="bairro" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="rua">Rua</label>
                                    <input type="text" class="form-control" id="rua" placeholder="Rua" name="rua" required>
                                </div>
                            </div>
    
                            <!-- Número do imóvel -->
                            <div class="form-row">
                                <div class="col-md-4 mb-3">
                                    <label for="numero">Número</label>
                                    <input type="text" class="form-control" id="numero" placeholder="Número" name="numero" required>
                                </div>
                            </div>

                            <!-- Vagas disponíveis e Total de vagas -->
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label for="vagas_disponiveis">Vagas Disponíveis</label>
                                    <input type="number" class="form-control" id="vagas_disponiveis" placeholder="Vagas Disponíveis" name="vagas_disp" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="total_vagas">Total de Vagas</label>
                                    <input type="number" class="form-control" id="total_vagas" placeholder="Total de Vagas" name="total_vagas" required>
                                </div>
                            </div>

                            <!-- Preço por hora -->
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label for="preco_hora">Preço por Hora (R$)</label>
                                    <input type="number" class="form-control" id="preco_hora" placeholder="Preço por Hora" step="0.01" name="preco_hora" required>
                                </div>
                            <!-- Data de Criação -->
                                <div class="col-md-6 mb-3">
                                    <label for="data_criacao">Data de Criação</label>
                                    <input type="datetime-local" class="form-control" id="data_criacao" name="data_cria" required>
                                </div>
                            </div>

                            <!-- Upload de imagens -->
                            <div class="form-row">
                                <div class="col-md-12 mb-3">
                                    <label for="imagem_estacionamento">Adicionar Imagens</label>
                                    <input type="file" class="form-control-file" id="imagem_estacionamento" accept="image/*" multiple required>
                                </div>
                            </div>
    
                            <!-- Botão de envio -->
                            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS e dependências -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/js/all.min.js"></script>
    <script src="scripts.js"></script>
    </body>
</html>
