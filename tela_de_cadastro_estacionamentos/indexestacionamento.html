<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar seu Estacionamento</title>
    <!-- Bootstrap CDN -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">

    <!-- Arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-light fixed-navbar">
        <a class="navbar-brand mx-auto" href="/Projeto_EasyPark_Facens-1/tela_inicial/index.html">
            <img src="/Projeto_EasyPark_Facens-1/imgs/easy01.png" alt="Logo" class="navbar-logo">
        </a>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card">
                    <div class="card-body">
                        <form>
                            <!-- Campo para o nome do estacionamento -->
                            <div class="form-row">
                                <div class="col-md-12 mb-3">
                                    <label for="nome">Nome do estacionamento</label>
                                    <input type="text" class="form-control" id="nome" placeholder="Nome do estacionamento" required>
                                </div>
                            </div>
    
                            <!-- Estado e Cidade -->
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label for="estado">Estado</label>
                                    <input type="text" class="form-control" id="estado" placeholder="Estado" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cidade">Cidade</label>
                                    <input type="text" class="form-control" id="cidade" placeholder="Cidade" required>
                                </div>
                            </div>
    
                            <!-- Bairro e Rua -->
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label for="bairro">Bairro</label>
                                    <input type="text" class="form-control" id="bairro" placeholder="Bairro" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="rua">Rua</label>
                                    <input type="text" class="form-control" id="rua" placeholder="Rua" required>
                                </div>
                            </div>
    
                            <!-- Número do imóvel -->
                            <div class="form-row">
                                <div class="col-md-4 mb-3">
                                    <label for="numero">Número</label>
                                    <input type="text" class="form-control" id="numero" placeholder="Número" required>
                                </div>
                            </div>

                            <!-- Vagas disponíveis e Total de vagas -->
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label for="vagas_disponiveis">Vagas Disponíveis</label>
                                    <input type="number" class="form-control" id="vagas_disponiveis" placeholder="Vagas Disponíveis" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="total_vagas">Total de Vagas</label>
                                    <input type="number" class="form-control" id="total_vagas" placeholder="Total de Vagas" required>
                                </div>
                            </div>

                            <!-- Preço por hora -->
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label for="preco_hora">Preço por Hora (R$)</label>
                                    <input type="number" class="form-control" id="preco_hora" placeholder="Preço por Hora" step="0.01" required>
                                </div>
                            </div>

                            <!-- Data de Criação -->
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label for="data_criacao">Data de Criação</label>
                                    <input type="datetime-local" class="form-control" id="data_criacao" required>
                                </div>
                            </div>

                            <!-- Upload de imagens -->
                            <div class="form-row">
                                <div class="col-md-12 mb-3">
                                    <label for="imagem_estacionamento">Adicionar Imagens</label>
                                    <input type="file" class="form-control-file" id="imagem_estacionamento" accept="image/*" multiple required>
                                </div>
                            </div>
    
                            <!-- Botão de envio -->
                            <button type="submit" class="btn btn-primary btn-block">Cadastre-se</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS e dependências -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/js/all.min.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
